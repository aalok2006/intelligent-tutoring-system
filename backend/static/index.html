<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Learning Platform</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <!-- Link Socket.IO client library -->
    <script src="https://cdn.socket.io/4.0.0/socket.io.min.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>AI Learning Platform</h1>
            <div id="auth-section">
                <button id="show-register">Register</button>
                <button id="show-login">Login</button>
                <span id="welcome-message" style="display:none;">Welcome, <span id="username-display"></span>!</span>
                <button id="logout" style="display:none;">Logout</button>
            </div>
        </header>

        <main id="main-content">
            <section id="auth-forms" style="display:block;">
                <div id="register-form">
                    <h2>Register</h2>
                    <input type="text" id="register-username" placeholder="Username">
                    <input type="email" id="register-email" placeholder="Email">
                    <input type="password" id="register-password" placeholder="Password">
                    <button id="register-btn">Register</button>
                    <p id="register-message"></p>
                </div>
                 <div id="login-form" style="display:none;">
                    <h2>Login</h2>
                    <input type="text" id="login-username" placeholder="Username">
                    <input type="password" id="login-password" placeholder="Password">
                    <button id="login-btn">Login</button>
                     <p id="login-message"></p>
                </div>
            </section>

            <section id="learning-section" style="display:none;">
                <h2>Your Learning Path</h2>
                <div id="path-visualization">
                    <!-- Path visualization goes here (e.g., SVG, Canvas, or simple list) -->
                    <p>Loading path...</p>
                </div>

                <hr>

                <h2>Current Activity</h2>
                <div id="current-activity">
                     <p>No activity selected or assigned.</p>
                     <!-- Current content/exercise/assessment UI loads here -->
                </div>

                <hr>

                <!-- Multi-Chat Panel (FR5.1) -->
                <div id="chat-panel">
                    <h3>Chats</h3>
                    <div id="chat-channels">
                        <!-- Channel list goes here (AI Tutor, Subject Q&A etc.) -->
                         <button class="chat-channel-btn" data-channel-type="ai_tutor" data-channel-id="ai-tutor-placeholder">AI Tutor</button>
                         <!-- Add other channel buttons dynamically -->
                    </div>
                    <div id="chat-windows">
                        <!-- Chat windows/tabs go here -->
                        <div id="chat-window-ai-tutor-placeholder" class="chat-window" style="display:block;" data-channel-id="ai-tutor-placeholder">
                            <h4>AI Tutor</h4>
                            <div class="chat-history">
                                <!-- Messages appear here -->
                            </div>
                            <div class="chat-input">
                                <input type="text" class="message-input" placeholder="Ask the AI Tutor...">
                                <button class="send-message-btn">Send</button>
                            </div>
                        </div>
                        <!-- Other chat windows -->
                    </div>
                </div>
            </section>
        </main>

        <footer>
            <p>© 2023 AI Learning Platform</p>
        </footer>
    </div>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
